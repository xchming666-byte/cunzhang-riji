<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>村长日记</title>
<style>
/* 村长日记 — Styles */
* { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    user-select: none;
    overflow: hidden;
  }

  /* ===== 顶部资源栏 ===== */
  .topbar {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 10px 20px;
    background: linear-gradient(135deg, #16213e, #0f3460);
    border-bottom: 2px solid #e94560;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    z-index: 100;
  }
  .game-title {
    font-size: 22px;
    font-weight: bold;
    color: #f5c518;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    margin-right: 10px;
  }
  .resource {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.08);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 16px;
    transition: all 0.3s;
  }
  .resource .icon { font-size: 20px; }
  .resource .val { font-weight: bold; min-width: 30px; }
  .resource.flash { background: rgba(80,250,123,0.25); transform: scale(1.05); }
  .resource .delta { font-size: 12px; color: #50fa7b; }
  .resource .delta.neg { color: #ff5555; }
  .spacer { flex: 1; }
  .village-level {
    background: linear-gradient(135deg, #e94560, #c23152);
    padding: 6px 16px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 15px;
  }
  .satisfaction-bar {
    width: 120px;
    height: 10px;
    background: rgba(255,255,255,0.15);
    border-radius: 5px;
    overflow: hidden;
  }
  .satisfaction-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff5555, #f1fa8c, #50fa7b);
    transition: width 0.5s;
    border-radius: 5px;
  }

  /* ===== 时间进度条 ===== */
  .time-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 14px;
    background: #0f1729;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    z-index: 99;
  }
  .time-bar .day-label {
    font-size: 13px;
    color: #f5c518;
    font-weight: bold;
    white-space: nowrap;
  }
  .time-bar .progress-track {
    flex: 1;
    height: 8px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    overflow: hidden;
  }
  .time-bar .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #e94560, #f5c518);
    border-radius: 4px;
    transition: width 0.3s linear;
  }
  .time-bar .ctrl-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #ccc;
    padding: 3px 10px;
    border-radius: 14px;
    font-size: 12px;
    cursor: pointer;
    font-weight: bold;
    font-family: inherit;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .time-bar .ctrl-btn:hover { background: rgba(255,255,255,0.18); }
  .time-bar .ctrl-btn.active {
    background: #50fa7b;
    color: #0f1729;
    border-color: #50fa7b;
    box-shadow: 0 0 10px rgba(80,250,123,0.5);
  }
  .time-bar .pause-btn.active {
    background: #e94560;
    color: #fff;
    border-color: #e94560;
    box-shadow: 0 0 10px rgba(233,69,96,0.5);
  }
  .time-bar .speed-group {
    display: flex;
    gap: 3px;
  }

  /* ===== 主区域 ===== */
  .main-area {
    display: flex;
    height: calc(100vh - 56px);
  }

  /* ===== 左侧建筑面板 ===== */
  .build-panel {
    width: 220px;
    background: #16213e;
    padding: 15px;
    overflow-y: auto;
    border-right: 1px solid rgba(255,255,255,0.1);
  }
  .panel-title {
    font-size: 15px;
    color: #f5c518;
    margin-bottom: 12px;
    font-weight: bold;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 8px;
  }
  .build-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px;
    margin-bottom: 8px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: #e0e0e0;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 14px;
    text-align: left;
  }
  .build-btn:hover {
    background: rgba(233,69,96,0.2);
    border-color: #e94560;
    transform: translateX(3px);
  }
  .build-btn.selected {
    background: rgba(233,69,96,0.3);
    border-color: #e94560;
    box-shadow: 0 0 12px rgba(233,69,96,0.4);
  }
  .build-btn.disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .build-btn.disabled:hover {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.1);
    transform: none;
  }
  .build-btn .b-icon { font-size: 28px; }
  .build-btn .b-info { flex: 1; }
  .build-btn .b-name { font-weight: bold; }
  .build-btn .b-cost { font-size: 12px; color: #888; margin-top: 2px; }
  .build-btn .b-cost .ok { color: #50fa7b; }
  .build-btn .b-cost .no { color: #ff5555; }
  .build-btn.demolish-btn {
    background: rgba(255, 85, 85, 0.08);
    border: 2px solid rgba(255, 85, 85, 0.4);
    color: #ff8888;
  }
  .build-btn.demolish-btn:hover { background: rgba(255, 85, 85, 0.18); }
  .build-btn.demolish-btn.selected {
    background: #ff5555;
    border-color: #ff5555;
    color: #fff;
    box-shadow: 0 0 12px rgba(255, 85, 85, 0.6);
  }

  /* ===== 地图区域 ===== */
  .map-area {
    flex: 1;
    position: relative;
    background: #2d5016;
    background-image: 
      repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(0,0,0,0.03) 20px, rgba(0,0,0,0.03) 40px),
      radial-gradient(circle at 30% 40%, rgba(50,100,20,0.3), transparent 60%),
      radial-gradient(circle at 70% 60%, rgba(80,120,30,0.2), transparent 50%);
    overflow: auto;
  }
  .map-area::-webkit-scrollbar { width: 10px; }
  .map-area::-webkit-scrollbar-track { background: rgba(0,0,0,0.15); }
  .map-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 5px; }
  .map-area::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
  .grid-container {
    display: grid;
    grid-template-columns: repeat(8, 92px);
    grid-template-rows: repeat(5, 92px);
    gap: 4px;
    padding: 10px;
    min-height: 100%;
    box-sizing: border-box;
  }
  .grid-cell {
    background: rgba(0,0,0,0.08);
    border: 1px dashed rgba(255,255,255,0.1);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    font-size: 32px;
  }
  .grid-cell:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.3);
  }
  .grid-cell.build-target {
    background: rgba(233,69,96,0.15);
    border: 2px solid #e94560;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 5px rgba(233,69,96,0.3); }
    50% { box-shadow: 0 0 20px rgba(233,69,96,0.6); }
  }
  .grid-cell.has-building {
    cursor: default;
    background: rgba(0,0,0,0.15);
    border: 1px solid rgba(255,255,255,0.15);
  }
  .grid-cell.demolish-target {
    border: 2px solid #ff5555 !important;
    box-shadow: 0 0 8px rgba(255, 85, 85, 0.5) inset;
    animation: demolish-pulse 1s infinite;
  }
  @keyframes demolish-pulse {
    0%, 100% { background: rgba(255, 85, 85, 0.1); }
    50% { background: rgba(255, 85, 85, 0.25); }
  }
  .grid-cell.demolish-flash {
    animation: flash-remove 0.5s ease-out;
  }
  @keyframes flash-remove {
    0% { background: rgba(255, 85, 85, 0.6); transform: scale(1); }
    100% { background: transparent; transform: scale(0.8); }
  }
  .grid-cell .building-emoji { font-size: 36px; filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.4)); }
  .grid-cell .worker-badge {
    position: absolute;
    bottom: 2px;
    right: 2px;
    background: #e94560;
    color: white;
    font-size: 11px;
    padding: 1px 5px;
    border-radius: 8px;
    font-weight: bold;
  }
  .grid-cell .level-badge {
    position: absolute;
    top: 2px;
    left: 2px;
    background: rgba(0,0,0,0.5);
    color: #f5c518;
    font-size: 10px;
    padding: 1px 4px;
    border-radius: 4px;
  }

  /* ===== 右侧信息面板 ===== */
  .info-panel {
    width: 260px;
    background: #16213e;
    padding: 15px;
    overflow-y: auto;
    border-left: 1px solid rgba(255,255,255,0.1);
  }
  .info-section {
    margin-bottom: 20px;
  }
  .info-section h3 {
    font-size: 14px;
    color: #f5c518;
    margin-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 5px;
  }
  .info-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 13px;
  }
  .info-row .label { color: #888; }
  .info-row .value { font-weight: bold; }
  .upgrade-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 3px 0;
    font-size: 12px;
  }
  .upgrade-row .req-met { color: #50fa7b; }
  .upgrade-row .req-not { color: #ff5555; }
  .upgrade-next {
    font-size: 12px;
    color: #f5c518;
    margin-bottom: 4px;
    font-weight: bold;
  }
  .upgrade-maxed {
    font-size: 13px;
    color: #50fa7b;
    text-align: center;
    padding: 8px 0;
  }
  .log-entry {
    font-size: 12px;
    padding: 6px 8px;
    margin-bottom: 4px;
    border-radius: 6px;
    background: rgba(255,255,255,0.05);
    border-left: 3px solid #555;
    line-height: 1.4;
  }
  .log-entry.good { border-left-color: #50fa7b; }
  .log-entry.bad { border-left-color: #ff5555; }
  .log-entry.event { border-left-color: #f5c518; }
  .log-entry .time { color: #666; font-size: 10px; }

  /* ===== 弹窗 ===== */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    border: 2px solid #e94560;
    border-radius: 16px;
    padding: 30px;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: modalIn 0.3s ease;
  }
  @keyframes modalIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal h2 { color: #f5c518; margin-bottom: 12px; font-size: 20px; }
  .modal p { margin-bottom: 20px; line-height: 1.6; font-size: 15px; }
  .modal-btns { display: flex; gap: 12px; justify-content: center; }
  .modal-btn {
    padding: 10px 28px;
    border: none;
    border-radius: 25px;
    font-size: 15px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s;
    font-family: inherit;
  }
  .modal-btn.yes { background: #e94560; color: white; }
  .modal-btn.yes:hover { background: #ff5577; transform: scale(1.05); }
  .modal-btn.no { background: rgba(255,255,255,0.1); color: #ccc; }
  .modal-btn.no:hover { background: rgba(255,255,255,0.2); }

  /* ===== 存档弹窗 ===== */
  .save-modal {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    border: 2px solid #e94560;
    border-radius: 16px;
    padding: 24px;
    max-width: 460px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: modalIn 0.3s ease;
  }
  .save-modal h2 { color: #f5c518; margin-bottom: 16px; font-size: 20px; text-align: center; }
  .save-slot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .save-slot:hover { background: rgba(233,69,96,0.15); border-color: rgba(233,69,96,0.4); }
  .save-slot.empty { opacity: 0.6; }
  .save-slot-info { flex: 1; text-align: left; }
  .save-slot-name { font-size: 14px; font-weight: bold; color: #f5c518; }
  .save-slot-detail { font-size: 12px; color: #888; margin-top: 2px; }
  .save-slot.empty .save-slot-detail { color: #555; }
  .save-slot-action { font-size: 20px; margin-left: 12px; }
  .save-close-btn {
    display: block;
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #ccc;
    border-radius: 25px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .save-close-btn:hover { background: rgba(255,255,255,0.18); }

  /* ===== 浮动提示 ===== */
  .float-text {
    position: absolute;
    font-size: 18px;
    font-weight: bold;
    pointer-events: none;
    animation: floatUp 1.5s ease-out forwards;
    z-index: 50;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
  }
  @keyframes floatUp {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-50px); opacity: 0; }
  }

  /* ===== 开始/升级提示 ===== */
  .levelup-toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, #f5c518, #e94560);
    color: white;
    padding: 20px 50px;
    border-radius: 16px;
    font-size: 24px;
    font-weight: bold;
    z-index: 999;
    display: none;
    box-shadow: 0 10px 40px rgba(245,197,24,0.5);
    text-align: center;
  }
  .levelup-toast.show { display: block; animation: levelupAnim 2.5s ease; }
  @keyframes levelupAnim {
    0% { transform: translate(-50%,-50%) scale(0); opacity: 0; }
    20% { transform: translate(-50%,-50%) scale(1.1); opacity: 1; }
    80% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(0.9); opacity: 0; }
  }

  /* ===== 成就系统 ===== */
  .achv-toast-wrap {
    position: fixed;
    top: 60px;
    right: 16px;
    z-index: 300;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .achv-toast {
    background: linear-gradient(135deg, rgba(245,197,24,0.95), rgba(233,69,96,0.95));
    color: #fff;
    padding: 10px 16px;
    border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.45);
    font-size: 13px;
    min-width: 200px;
    animation: achvIn 0.4s ease, achvOut 0.5s ease 3.2s forwards;
  }
  .achv-toast .t1 { font-size: 11px; opacity: 0.85; letter-spacing: 1px; }
  .achv-toast .t2 { font-size: 15px; font-weight: bold; margin: 2px 0; }
  .achv-toast .t3 { font-size: 11px; opacity: 0.9; }
  @keyframes achvIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes achvOut { to { transform: translateX(120%); opacity: 0; } }

  .achv-modal {
    background: linear-gradient(145deg, #1a1a2e, #16213e);
    border: 2px solid #f5c518;
    border-radius: 16px;
    padding: 20px;
    max-width: 620px;
    width: 92%;
    max-height: 82vh;
    overflow-y: auto;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    animation: modalIn 0.3s ease;
  }
  .achv-modal h2 { color: #f5c518; margin-bottom: 6px; font-size: 20px; text-align: center; }
  .achv-progress-bar {
    height: 8px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    overflow: hidden;
    margin: 10px 0 16px;
  }
  .achv-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #f5c518, #50fa7b);
    transition: width 0.4s ease;
  }
  .achv-group-title {
    font-size: 12px;
    color: #8fa3c8;
    margin: 14px 0 6px;
    border-bottom: 1px dashed rgba(255,255,255,0.12);
    padding-bottom: 4px;
  }
  .achv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 8px; }
  .achv-card {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    padding: 8px 10px;
    border-radius: 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .achv-card.done {
    background: rgba(245,197,24,0.12);
    border-color: rgba(245,197,24,0.45);
  }
  .achv-card .ic { font-size: 22px; line-height: 1; filter: grayscale(1) opacity(0.45); }
  .achv-card.done .ic { filter: none; }
  .achv-card .nm { font-size: 13px; font-weight: bold; color: #777f92; }
  .achv-card.done .nm { color: #f5c518; }
  .achv-card .ds { font-size: 11px; color: #6c7488; line-height: 1.4; margin-top: 2px; }
  .achv-card.done .ds { color: #b9c4d8; }
  .achv-card .rw { font-size: 10px; color: #50fa7b; margin-top: 3px; }

  /* 通关目标清单 */
  .goal-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 3px 0;
    font-size: 12px;
  }
  .goal-row .g-done { color: #50fa7b; }
  .goal-row .g-todo { color: #ff8a8a; }
  .goal-hint { font-size: 11px; color: #8fa3c8; margin-top: 6px; line-height: 1.5; }

  /* 通关结算 */
  .win-modal {
    background: linear-gradient(145deg, #23213e, #3a2a1a);
    border: 2px solid #f5c518;
    border-radius: 18px;
    padding: 24px;
    max-width: 480px;
    width: 92%;
    max-height: 85vh;
    overflow-y: auto;
    text-align: center;
    box-shadow: 0 0 60px rgba(245,197,24,0.35);
    animation: modalIn 0.4s ease;
  }
  .win-rank {
    font-size: 64px;
    font-weight: bold;
    line-height: 1;
    margin: 8px 0;
    background: linear-gradient(135deg, #f5c518, #ff8a3d);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .win-stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 5px 2px;
    border-bottom: 1px dashed rgba(255,255,255,0.1);
  }
  .win-stat-row .v { color: #f5c518; font-weight: bold; }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

  /* ============================================ */
  /* ============= 移动端适配 =================== */
  /* ============================================ */
  @media (max-width: 768px) {
    body { overflow: auto; }

    /* 时间进度条移动端 */
    .time-bar { padding: 3px 8px; gap: 6px; }
    .time-bar .day-label { font-size: 11px; }
    .time-bar .progress-track { height: 6px; }
    .time-bar .ff-btn, .time-bar .ctrl-btn { padding: 2px 8px; font-size: 10px; }
    .save-modal { padding: 16px; max-width: 95%; }
    .save-modal h2 { font-size: 16px; }
    .save-slot { padding: 10px 12px; }
    .save-slot-name { font-size: 13px; }
    .save-slot-detail { font-size: 11px; }

    /* 顶部资源栏改成两行 */
    .topbar {
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 10px;
    }
    .game-title {
      font-size: 16px;
      margin-right: 4px;
      width: 100%;
      margin-bottom: 4px;
    }
    .resource {
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 14px;
    }

<script>
// ===================== 游戏数据 =====================
const RESOURCES={gold:500,food:50,wood:30,stone:0,water:20};
let population=3,popMax=5,satisfaction=65,health=80;
let villageLevel=1,research=0,officials=0,day=1,gameTime=0;
let gameSpeed=1,gamePaused=false,tickInterval=null,selectedBuilding=null,demolishMode=false;
let buildings=[],GRID_COLS=8,GRID_ROWS=5,gridData=[];

const DEFAULT_STATS={goldEarned:0,foodProduced:0,buildingsBuilt:0,upgradesDone:0,banditsFought:0,banditsPerfect:0,eventsHandled:0,maxPop:3};
let stats={...DEFAULT_STATS},unlockedAchievements=[],gameWon=false;

// 建筑定义
const BT={
  farm:{n:'农田',c:'🌾',cost:{wood:5},maxW:3,prod:{food:2},cons:{water:1},minLv:1,unlocked:true},
  lumber:{n:'伐木场',c:'🪵',cost:{wood:3},maxW:2,prod:{wood:1},cons:{water:1},minLv:1,unlocked:true},
  well:{n:'水井',c:'💧',cost:{wood:5,gold:20},maxW:0,prod:{water:2},minLv:1,unlocked:true},
  house:{n:'民居',c:'🏠',cost:{wood:8,gold:30},maxW:0,popB:3,minLv:1,unlocked:true},
  quarry:{n:'采石场',c:'⛏️',cost:{wood:10,gold:50},maxW:2,prod:{stone:1},minLv:2,unlocked:false},
  market:{n:'集市',c:'🏪',cost:{wood:15,stone:5},maxW:2,prod:{gold:5},minLv:2,unlocked:false},
  clinic:{n:'医馆',c:'🏥',cost:{stone:10,gold:80},maxW:1,satB:10,minLv:2,unlocked:false},
  school:{n:'学堂',c:'📚',cost:{stone:15,gold:120},maxW:3,minLv:2,unlocked:false},
  mill:{n:'磨坊',c:'🏭',cost:{stone:20,wood:20},maxW:1,minLv:3,unlocked:false},
  teahouse:{n:'茶馆',c:'🍵',cost:{stone:15,gold:150},maxW:1,satB:15,minLv:3,unlocked:false},
  wall:{n:'城墙',c:'🏰',cost:{stone:50},maxW:0,minLv:3,unlocked:false},
  temple:{n:'祠堂',c:'⛩️',cost:{stone:30,gold:200},maxW:1,satB:20,minLv:3,unlocked:false},
  paifang:{n:'牌坊',c:'🏛️',cost:{stone:40,gold:300},maxW:0,satB:15,minLv:3,unlocked:false}
};
const BT_KEYS=Object.keys(BT);
const BUILDING_TYPES=BT; // 别名

// 事件定义
const EVENTS=[
  {type:'refugee',w:20,minLv:1,t:'🏘️ 流民投靠',txt:'一群流民来到村口，请求加入你的村庄。',ch:[
    {t:'接纳 (+1人口)',a:()=>{population=Math.min(population+1,popMax+5);addLog('流民加入了村庄，人口+1','good')}},
    {t:'拒绝',a:()=>{addLog('你拒绝了流民','event')}}]},
  {type:'merchant',w:15,minLv:1,t:'🐪 商队路过',txt:'商队愿意用金币交换你的食物。',ch:[
    {t:'买食物 (-50💰,+40🌾)',a:()=>{if(RESOURCES.gold>=50){RESOURCES.gold-=50;RESOURCES.food+=40;addLog('从商队买了40食物','good')}else addLog(`金币不够（当前${Math.floor(RESOURCES.gold)}）`,'bad')}},
    {t:'卖食物 (+40💰,-30🌾)',a:()=>{if(RESOURCES.food>=30){RESOURCES.food-=30;RESOURCES.gold+=40;addLog('卖给商队30食物，赚了40金币','good')}else addLog(`食物不够（当前${Math.floor(RESOURCES.food)}），没卖成`,'bad')}},
    {t:'不用了',a:()=>{addLog('商队离开了','event')}}]},
  {type:'harvest',w:10,minLv:1,t:'🎉 丰收！',txt:'今年风调雨顺，农田大丰收！',ch:[{t:'太好了！(+50🌾)',a:()=>{RESOURCES.food+=50;addLog('丰收！食物+50','good')}}]},
  {type:'drought',w:12,minLv:1,t:'☀️ 旱灾',txt:'连续干旱，农田减产。',ch:[{t:'熬过去',a:()=>{RESOURCES.food=Math.max(0,RESOURCES.food-30);RESOURCES.water=Math.max(0,RESOURCES.water-10);health=Math.max(0,health-10);satisfaction=Math.max(0,satisfaction-5);addLog('旱灾导致食物-30，水-10，健康-10，满意度-5','bad')}}]},
  {type:'bandit',w:8,minLv:1,t:'🗡️ 盗匪来袭！',txt:'一伙盗匪袭击了村庄！',ch:[{t:'防御',a:()=>{}}]},
  {type:'plague',w:6,minLv:1,t:'🦠 瘟疫蔓延',txt:'村庄爆发瘟疫，村民们生病了。',ch:[
    {t:'全力救治 (-100💰, -20😊)',a:()=>{if(RESOURCES.gold>=100){RESOURCES.gold-=100;satisfaction=Math.max(0,satisfaction-20);addLog('全力救治村民，金币-100','bad')}else{population=Math.max(1,population-2);satisfaction=Math.max(0,satisfaction-15);addLog('无力救治，2位村民病逝','bad')}}},
    {t:'隔离 (+10😊)',a:()=>{if(hasClinic()){addLog('医馆控制住了疫情','good')}else{health=Math.max(0,health-20);satisfaction=Math.max(0,satisfaction-5);addLog('隔离了感染者，健康-20','bad')}}}]},
  {type:'festival',w:8,minLv:2,t:'🎊 村民庆典',txt:'村民们自发组织庆典，需要你的支持。',ch:[
    {t:'资助庆典 (-50💰,+15😊)',a:()=>{if(RESOURCES.gold>=50){RESOURCES.gold-=50;satisfaction=Math.min(100,satisfaction+15);addLog('庆典让村民们很开心','good')}else addLog('金币不够','bad')}},
    {t:'口头支持 (+5😊)',a:()=>{satisfaction=Math.min(100,satisfaction+5);addLog('村民们自发庆祝','good')}}]},
  {type:'trader',w:10,minLv:2,t:'🧙 游方工匠',txt:'一位工匠路过，愿意为你的村庄修建建筑。',ch:[
    {t:'雇佣 (-80💰，随机建造)',a:()=>{if(RESOURCES.gold>=80){RESOURCES.gold-=80;const ks=BT_KEYS.filter(k=>BT[k].minLv<=villageLevel&&BT[k].unlocked);if(ks.length){const rk=ks[Math.floor(Math.random()*ks.length)];const bt=BT[rk];let idx;for(let t=0;t<100;t++){idx=Math.floor(Math.random()*gridData.length);if(!gridData[idx])break}if(!gridData[idx]){const b={type:rk,workers:0,level:1,guards:0,index:idx};if(bt.maxW>0&&bt.prod&&Object.keys(bt.prod).length&&getIdlePopulation()>=1)b.workers=1;gridData[idx]=b;buildings.push(b);if(bt.popB)popMax+=bt.popB;if(bt.satB)satisfaction=Math.min(100,satisfaction+bt.satB);renderAll();addLog(`工匠建造了${bt.n}`,'good')}}else addLog('金币不够','bad')}}},
    {t:'不用了',a:()=>addLog('工匠离开了','event')}]},
  {type:'taxman',w:5,minLv:3,t:'👑 朝廷来使',txt:'朝廷派来了税务官，要求缴纳税收。',ch:[
    {t:'乖乖交税 (-150💰,+10😊)',a:()=>{if(RESOURCES.gold>=150){RESOURCES.gold-=150;satisfaction=Math.min(100,satisfaction+10);addLog('交了税，朝廷很满意','good')}else{population=Math.max(1,population-1);addLog('没钱交税，1位村民被征去服劳役','bad')}}},
    {t:'贿赂官员 (-100💰)',a:()=>{if(RESOURCES.gold>=100){RESOURCES.gold-=100;addLog('税务官收了好处，睁一只眼闭一只眼','event')}else{population=Math.max(1,population-1);addLog('没钱交税，1位村民被征去服劳役','bad')}}}]}
];

const WALL_RED={1:.3,2:.5,3:.7},WALL_CAP={1:2,2:3,3:4};
const BANDIT_NAME={small:'小股盗匪',gang:'盗匪团伙',army:'盗匪大军'};

// 成就系统
const ACHIEVEMENTS=[
  {id:'first_build',g:'建设',ic:'🏡',nm:'破土动工',ds:'建造第一座建筑',rw:{gold:50},ck:()=>stats.buildingsBuilt>=1},
  {id:'build10',g:'建设',ic:'🧱',nm:'初具规模',ds:'建筑达到10座',rw:{gold:150},ck:()=>buildings.length>=10},
  {id:'build25',g:'建设',ic:'🏘️',nm:'阡陌纵横',ds:'建筑达到25座',rw:{gold:400},ck:()=>buildings.length>=25},
  {id:'upgrade_max',g:'建设',ic:'⭐',nm:'精益求精',ds:'任意建筑升到Lv3',rw:{gold:200},ck:()=>buildings.some(b=>b.level>=3)},
  {id:'all_types',g:'建设',ic:'🗺️',nm:'百业俱兴',ds:'集齐13种建筑',rw:{gold:800,sat:5},ck:()=>new Set(buildings.map(b=>b.type)).size>=13},
  {id:'pop20',g:'民生',ic:'👥',nm:'人丁兴旺',ds:'人口达到20',rw:{sat:3},ck:()=>population>=20},
  {id:'pop50',g:'民生',ic:'🎏',nm:'万家灯火',ds:'人口达到50',rw:{gold:500},ck:()=>population>=50},
  {id:'full_employ',g:'民生',ic:'👷',nm:'人尽其才',ds:'人口≥15且零闲置',rw:{gold:200},ck:()=>population>=15&&getIdlePopulation()===0},
  {id:'survive50',g:'民生',ic:'📅',nm:'五十日谈',ds:'存活满50天',rw:{food:200},ck:()=>day>=50},
  {id:'gold1000',g:'经济',ic:'💰',nm:'家有余粮',ds:'金币达到1000',rw:{sat:2},ck:()=>RESOURCES.gold>=1000},
  {id:'gold5000',g:'经济',ic:'🏦',nm:'富甲一方',ds:'累计赚5000金',rw:{gold:300},ck:()=>stats.goldEarned>=5000},
  {id:'food500',g:'经济',ic:'🌾',nm:'仓廪殷实',ds:'食物储量达500',rw:{sat:5},ck:()=>RESOURCES.food>=500},
  {id:'sat90',g:'治理',ic:'😊',nm:'政通人和',ds:'满意度达90',rw:{gold:300},ck:()=>satisfaction>=90},
  {id:'health95',g:'治理',ic:'🏥',nm:'无病无灾',ds:'健康度达95',rw:{research:20},ck:()=>health>=95},

// ===================== 工具函数 =====================
function addLog(t,ty='event'){const a=document.getElementById('log-area'),e=document.createElement('div');e.className=`log-entry ${ty}`;e.innerHTML=`<span class="time">第${day}天</span> ${t}`;a.insertBefore(e,a.firstChild);while(a.children.length>15)a.removeChild(a.lastChild)}
function flashResource(id){const e=document.getElementById(id);if(!e)return;e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),400)}
function hasClinic(){return buildings.some(b=>b.type==='clinic')}
function hasPaifang(){return buildings.some(b=>b.type==='paifang')}
function hasMill(){return buildings.some(b=>b.type==='mill')}
function builtTypeCount(){return new Set(buildings.map(b=>b.type)).size}
function getWall(){return buildings.find(b=>b.type==='wall')}
function getWallReduction(){const w=getWall();return w?WALL_RED[w.level]||0:0}
function getTotalGuards(){return buildings.reduce((s,b)=>s+(b.guards||0),0)}
function getGuardBonus(){return getTotalGuards()*.1}
function getWallCap(){const w=getWall();return w?WALL_CAP[w.level]||0:0}
function getWallUpkeep(b){return(b.level+1)+(b.guards||0)}
function applyWallUpkeep(wall){const up=getWallUpkeep(wall),justU=!wall.underfunded;if(RESOURCES.stone>=up){RESOURCES.stone-=up;wall.underfunded=false;return{upkeep:up,charged:up,underfunded:false,justUnderfunded:false}}else{RESOURCES.stone=0;wall.underfunded=true;return{upkeep:up,charged:0,underfunded:true,justUnderfunded:justU}}}
function canAssignGuard(b){const cap=WALL_CAP[b.level]||0,guards=b.guards||0,next=getWallUpkeep(b)+1,stoneOk=villageLevel>=4?RESOURCES.stone>=next:true;return guards<cap&&getIdlePopulation()>=1&&!b.underfunded&&stoneOk}
function getTotalScholars(){return buildings.reduce((s,b)=>s+(b.scholars||0),0)}
function getIdlePopulation(){let a=getTotalGuards()+getTotalScholars()+officials;for(const b of buildings)a+=b.workers||0;return Math.max(0,population-a)}
function getGridSize(lv){if(lv<=1)return{cols:8,rows:5};if(lv===2)return{cols:9,rows:5};if(lv===3)return{cols:10,rows:6};return{cols:12,rows:6}}

function getBanditScale(){const p=(villageLevel-1)*.12,pS=Math.max(.2,.6-p),pA=Math.min(.4,.1+p),r=Math.random();if(r<pS)return'small';if(r<pS+(1-pS-pA))return'gang';return'army'}
function getBanditDemand(s){if(s==='small')return{gold:50};if(s==='gang')return Math.random()<.5?{gold:100}:{casualties:1};return Math.random()<.5?{gold:200}:{casualties:2}}

// ===================== 网格 =====================
function remapBuildings(oldC,oldR,newC,newR){const old=gridData.slice();gridData.length=0;for(let i=0;i<newC*newR;i++)gridData.push(null);for(let i=0;i<oldC*oldR;i++){if(!old[i])continue;const oc=i%oldC,or=Math.floor(i/oldC);let nc=Math.min(newC-1,Math.round((oc+.5)*newC/oldC)),nr=Math.min(newR-1,Math.round((or+.5)*newR/oldR));for(let d=0;d<20;d++){const dc=[0,1,-1,0,1,-1,1,-1][d%8],dr=[1,0,0,-1,-1,1,-1,1][d%8];if(!gridData[nr*newC+nc])break;nc=Math.max(0,Math.min(newC-1,Math.round((oc+.5)*newC/oldC)+dc));nr=Math.max(0,Math.min(newR-1,Math.round((or+.5)*newR/oldR)+dr))}const ni=nr*newC+nc;gridData[ni]=old[i];gridData[ni].index=ni}}

function initGrid(){const sz=getGridSize(villageLevel);const nc=sz.cols,nr=sz.rows,ol=gridData.length;if(ol){remapBuildings(GRID_COLS,GRID_ROWS,nc,nr)}else{for(let i=0;i<nc*nr;i++)gridData.push(null)}GRID_COLS=nc;GRID_ROWS=nr;const g=document.getElementById('grid');g.style.gridTemplateColumns=`repeat(${nc},1fr)`;g.innerHTML='';for(let i=0;i<nc*nr;i++){const c=document.createElement('div');c.className='grid-cell';c.onclick=()=>onCellClick(i,c);g.appendChild(c);if(gridData[i]&&gridData[i].type)renderCell(i,c)}}

function onCellClick(idx,cell){if(demolishMode){if(gridData[idx]){demolishBuilding(idx,cell)}return}if(selectedBuilding){placeBuilding(idx,cell);return}if(gridData[idx]){const t=gridData[idx].type;const btype=BT[t];if(btype.maxW>0&&btype.prod&&Object.keys(btype.prod).length){openWorkerMenu(idx,cell);return}if(t==='school'){openSchoolMenu(idx,cell);return}if(t==='wall'){openWallMenu(idx,cell);return}if(t==='paifang'){openPaifangMenu(idx,cell);return}tryUpgradeBuilding(idx,cell)}}

function renderCell(idx,cell){const b=gridData[idx];if(!b||!b.type)return;const bt=BT[b.type];cell.classList.add('has-building');let h=`<span class="building-emoji">${bt.c}</span><span class="level-badge">Lv${b.level}</span>`;if(b.workers>0)h+=`<span class="worker-badge">👷${b.workers}</span>`;if(b.guards>0)h+=`<span class="worker-badge" style="background:#4a4;top:auto;bottom:2px;right:2px">🛡️${b.guards}</span>`;if(b.scholars>0)h+=`<span class="worker-badge" style="background:#48b">📖${b.scholars}</span>`;cell.innerHTML=h}

function renderAll(){const cs=document.querySelectorAll('.grid-cell');for(const b of buildings){const c=cs[b.index];if(c)renderCell(b.index,c)}}

// ===================== 建筑操作 =====================
function placeBuilding(idx,cell){const bt=BT[selectedBuilding];if(villageLevel<bt.minLv)return;for(const[k,v]of Object.entries(bt.cost)){if(RESOURCES[k]<v){addLog(`建造${bt.n}失败：资源不足`,'bad');return}}for(const[k,v]of Object.entries(bt.cost))RESOURCES[k]-=v;const b={type:selectedBuilding,workers:0,level:1,guards:0,index:idx};if(bt.maxW>0&&bt.prod&&Object.keys(bt.prod).length&&getIdlePopulation()>=1)b.workers=1;gridData[idx]=b;buildings.push(b);renderCell(idx,cell);if(bt.popB)popMax+=bt.popB;if(bt.satB)satisfaction=Math.min(100,satisfaction+bt.satB);stats.buildingsBuilt++;addLog(`建造了${bt.n}`,'good');flashResource('res-gold');selectedBuilding=null;document.querySelectorAll('.build-btn').forEach(b=>b.classList.remove('selected'));updateUI()}

function tryUpgradeBuilding(idx,cell){const b=gridData[idx];if(!b)return;const bt=BT[b.type];if(b.level>=3){addLog(`${bt.n}已是最高等级`,'event');return}const cost={};for(const[k,v]of Object.entries(bt.cost))cost[k]=Math.floor(v*(b.level+1)*.8);for(const[k,v]of Object.entries(cost)){if(RESOURCES[k]<v){addLog(`${bt.n}升级失败：资源不足`,'bad');return}}for(const[k,v]of Object.entries(cost))RESOURCES[k]-=v;b.level++;stats.upgradesDone++;const bi=buildings.findIndex(bb=>bb.index===idx);if(bi>=0)buildings[bi].level=b.level;if(bt.popB)popMax+=bt.popB;cell.querySelector('.level-badge').textContent=`Lv${b.level}`;addLog(`${bt.n}升级到Lv${b.level}`,'good');updateUI()}

function demolishBuilding(idx,cell){const b=gridData[idx];if(!b)return;const bt=BT[b.type];for(const[k,v]of Object.entries(bt.cost))RESOURCES[k]+=Math.floor(v*.5);if(bt.popB)popMax-=bt.popB*b.level;cell.classList.remove('has-building');cell.innerHTML='';gridData[idx]=null;buildings=buildings.filter(bb=>bb.index!==idx);addLog(`拆除了${bt.n}（返还50%资源）`,'event');updateUI()}

function openWorkerMenu(idx,cell){const b=gridData[idx];if(!b)return;const bt=BT[b.type],workers=b.workers||0,cap=bt.maxW,idle=getIdlePopulation(),rk=Object.keys(bt.prod)[0],rm={food:'食物',wood:'木材',stone:'石材',gold:'金币',water:'水'},rl=rm[rk]||rk,pw=bt.prod[rk];let m=workers*pw*b.level;if(b.type==='farm'&&hasMill())m*=2;if(b.type==='market'&&hasPaifang())m*=1.3;if(officials>0)m*=(1+.05*officials);document.getElementById('modal-title').textContent=`${bt.c} ${bt.n}`;document.getElementById('modal-text').innerHTML=`👷 工人：${workers}/${cap}<br>📊 每5秒产出：${m.toFixed(1)} ${rl}<br>👤 闲置村民：${idle}`;const ct=document.getElementById('modal-btns');ct.innerHTML='';const add=document.createElement('button');add.className='modal-btn yes';add.textContent=`派工人 (+1)`;add.disabled=workers>=cap||idle<1;add.onclick=()=>{b.workers++;renderCell(idx,cell);updateUI();document.getElementById('modal-overlay').classList.remove('show')};ct.appendChild(add);const rmBtn=document.createElement('button');rmBtn.className='modal-btn no';rmBtn.textContent='撤回工人 (-1)';rmBtn.disabled=workers<=0;rmBtn.onclick=()=>{b.workers--;renderCell(idx,cell);updateUI();document.getElementById('modal-overlay').classList.remove('show')};ct.appendChild(rmBtn);const close=document.createElement('button');close.className='modal-btn no';close.textContent='关闭';close.onclick=()=>document.getElementById('modal-overlay').classList.remove('show');ct.appendChild(close);document.getElementById('modal-overlay').classList.add('show')}

function openSchoolMenu(idx,cell){const b=gridData[idx];if(!b)return;const sc=b.scholars||0,cap=BT.school.maxW,idle=getIdlePopulation(),rp=hasPaifang()?3:2;document.getElementById('modal-title').textContent='📚 学堂';document.getElementById('modal-text').innerHTML=`📖 学者：${sc}/${cap}<br>💡 每天产出：${sc*rp} 研究点<br>👤 闲置村民：${idle}`;const ct=document.getElementById('modal-btns');ct.innerHTML='';const add=document.createElement('button');add.className='modal-btn yes';add.textContent='派遣学者 (+1)';add.disabled=sc>=cap||idle<1;add.onclick=()=>{b.scholars=(b.scholars||0)+1;renderCell(idx,cell);updateUI();document.getElementById('modal-overlay').classList.remove('show')};ct.appendChild(add);const rmBtn=document.createElement('button');rmBtn.className='modal-btn no';rmBtn.textContent='召回学者 (-1)';rmBtn.disabled=sc<=0;rmBtn.onclick=()=>{b.scholars=Math.max(0,(b.scholars||0)-1);renderCell(idx,cell);updateUI();document.getElementById('modal-overlay').classList.remove('show')};ct.appendChild(rmBtn);const close=document.createElement('button');close.className='modal-btn no';close.textContent='关闭';close.onclick=()=>document.getElementById('modal-overlay').classList.remove('show');ct.appendChild(close);document.getElementById('modal-overlay').classList.add('show')}

function openWallMenu(idx,cell){const b=gridData[idx];if(!b)return;const cap=getWallCap(),guards=b.guards||0,redPct=Math.round(getWallReduction()*100),idle=getIdlePopulation(),upkeep=getWallUpkeep(b);let ml=villageLevel>=4?`⚙️ 维护费：${upkeep} 石材/天`:'⚙️ Lv4后开启维护费';if(b.underfunded)ml='⚠️ 欠费！暂停增派守卫。补足石材后可恢复。';document.getElementById('modal-title').textContent=`🏰 城墙 Lv.${b.level}`;document.getElementById('modal-text').innerHTML=`🛡️ 减伤：${redPct}%<br>🛡️ 守卫：${guards}/${cap}（每名+10%）<br>${ml}<br>👤 闲置村民：${idle}`;const ct=document.getElementById('modal-btns');ct.innerHTML='';const cost={};for(const[k,v]of Object.entries(BT.wall.cost))cost[k]=Math.floor(v*(b.level+1)*.8);const canUp=b.level<3&&Object.entries(cost).every(([r,c])=>RESOURCES[r]>=c);if(canUp){const upBtn=document.createElement('button');upBtn.className='modal-btn yes';upBtn.textContent=`升级到Lv${b.level+1} (${Object.entries(cost).map(([r,c])=>`${r==='stone'?'🪨':r==='wood'?'🪵':'💰'}${c}`).join(',')})`;upBtn.onclick=()=>{for(const[k,v]of Object.entries(cost))RESOURCES[k]-=v;b.level++;stats.upgradesDone++;renderCell(idx,cell);updateUI();addLog(`城墙升级到Lv${b.level}`,'good');document.getElementById('modal-overlay').classList.remove('show')};ct.appendChild(upBtn)}const addBtn=document.createElement('button');addBtn.className='modal-btn yes';addBtn.textContent='增派守卫 (+1)';addBtn.disabled=!canAssignGuard(b);addBtn.onclick=()=>{b.guards=(b.guards||0)+1;renderCell(idx,cell);updateUI();document.getElementById('modal-overlay').classList.remove('show')};ct.appendChild(addBtn);const rmBtn=document.createElement('button');rmBtn.className='modal-btn no';rmBtn.textContent='撤回守卫 (-1)';rmBtn.disabled=guards<=0;rmBtn.onclick=()=>{b.guards=Math.max(0,(b.guards||0)-1);renderCell(idx,cell);updateUI();document.getElementById('modal-overlay').classList.remove('show')};ct.appendChild(rmBtn);const close=document.createElement('button');close.className='modal-btn no';close.textContent='关闭';close.onclick=()=>document.getElementById('modal-overlay').classList.remove('show');ct.appendChild(close);document.getElementById('modal-overlay').classList.add('show')}

function openPaifangMenu(idx,cell){const b=gridData[idx];if(!b)return;const cap=3,idle=getIdlePopulation();document.getElementById('modal-title').textContent='🏛️ 牌坊';document.getElementById('modal-text').innerHTML=`🏛️ 文官：${officials}/${cap}（每人全产出+5%）<br>👤 闲置村民：${idle}`;const ct=document.getElementById('modal-btns');ct.innerHTML='';const add=document.createElement('button');add.className='modal-btn yes';add.textContent='任命文官 (+1)';add.disabled=officials>=cap||idle<1;add.onclick=()=>{officials++;updateUI();document.getElementById('modal-overlay').classList.remove('show')};ct.appendChild(add);const rmBtn=document.createElement('button');rmBtn.className='modal-btn no';rmBtn.textContent='罢免文官 (-1)';rmBtn.disabled=officials<=0;rmBtn.onclick=()=>{officials=Math.max(0,officials-1);updateUI();document.getElementById('modal-overlay').classList.remove('show')};ct.appendChild(rmBtn);const close=document.createElement('button');close.className='modal-btn no';close.textContent='关闭';close.onclick=()=>document.getElementById('modal-overlay').classList.remove('show');ct.appendChild(close);document.getElementById('modal-overlay').classList.add('show')}

function toggleDemolishMode(){demolishMode=!demolishMode;selectedBuilding=null;document.querySelectorAll('.build-btn').forEach(b=>b.classList.remove('selected'));addLog(demolishMode?'拆除模式开启，点击建筑拆除（返还50%资源）':'拆除模式关闭','event')}

// ===================== 建筑面板 =====================
function renderBuildPanel(){const c=document.getElementById('build-buttons');c.innerHTML='';let canAny=false;for(const[k,v]of Object.entries(BT)){if(!v.unlocked)continue;const btn=document.createElement('button');btn.className='build-btn';btn.dataset.type=k;let afford=true,costStr='';for(const[r,amt]of Object.entries(v.cost)){const ic=r==='gold'?'💰':r==='food'?'🌾':r==='wood'?'🪵':r==='stone'?'🪨':'💧';const ok=RESOURCES[r]>=amt;if(!ok)afford=false;costStr+=`${ic}${amt} `}btn.textContent=`${v.c} ${v.n} (${costStr.trim()})`;if(!afford){canAny=false;btn.style.opacity='.5'}else canAny=true;btn.onclick=()=>{selectedBuilding=(selectedBuilding===k?null:k);document.querySelectorAll('.build-btn').forEach(b=>b.classList.remove('selected'));if(selectedBuilding===k){btn.classList.add('selected');demolishMode=false}};c.appendChild(btn)}const dm=document.createElement('button');dm.className='build-btn';dm.style.background=demolishMode?'rgba(233,69,96,.3)':'';dm.textContent='🔨 拆除';dm.onclick=()=>{toggleDemolishMode();dm.style.background=demolishMode?'rgba(233,69,96,.3)':'';if(demolishMode){selectedBuilding=null;document.querySelectorAll('.build-btn:not(:last-child)').forEach(b=>b.classList.remove('selected'))}};c.appendChild(dm)}

// ===================== 游戏主循环 =====================
function tick(){if(gamePaused)return;gameTime++;if(gameTime%30===0){day++;if(hasClinic())health=Math.min(100,health+5);let nrp=0;for(const b of buildings){if(b.type==='school'&&(b.scholars||0)>0){let rp=b.scholars*2;if(hasPaifang())rp=Math.round(rp*1.5);nrp+=rp}}if(nrp>0)research+=nrp;const wall=getWall();if(wall&&villageLevel>=4){const r=applyWallUpkeep(wall);if(r.justUnderfunded)addLog('⚠️ 石材不足以维护城墙，已欠费——暂停增派守卫！','bad')}}const dp=(gameTime%30)/30*100;document.getElementById('time-progress').style.width=dp+'%';document.getElementById('time-day').textContent=`第${day}天`;if(gameTime%5===0){let income={food:0,wood:0,stone:0,gold:0,water:0};let wp=0;for(const b of buildings){const bt=BT[b.type];if(bt.prod&&bt.prod.water)wp+=bt.prod.water*b.level}let bwc=0;for(const b of buildings){const bt=BT[b.type];if(bt.cons&&bt.cons.water)bwc+=bt.cons.water*b.level}const ws=bwc>0&&(RESOURCES.water+wp)<bwc;for(const b of buildings){const bt=BT[b.type];if(!bt.prod)continue;let mul;if(bt.maxW>0)mul=(b.workers||0)*b.level;else mul=b.level;if(b.type==='farm'&&hasMill())mul*=2;if(b.type==='market'&&hasPaifang())mul*=1.3;if(officials>0)mul*=(1+.05*officials);if(ws&&bt.cons&&bt.cons.water)mul=0;for(const[r,amt]of Object.entries(bt.prod))income[r]+=amt*mul}RESOURCES.food+=income.food;RESOURCES.wood+=income.wood;RESOURCES.stone+=income.stone;RESOURCES.gold+=income.gold;RESOURCES.water+=income.water;stats.goldEarned+=income.gold;stats.foodProduced+=income.food;if(bwc>0){RESOURCES.water-=bwc;if(RESOURCES.water<0){RESOURCES.water=0;satisfaction=Math.max(0,satisfaction-3);if(Math.random()<.4)addLog('水源不足，需水建筑停产！','bad')}}let vw=population,vf=population;RESOURCES.water-=vw;RESOURCES.food-=vf;if(RESOURCES.water<0){RESOURCES.water=0;satisfaction=Math.max(0,satisfaction-3);addLog('村民饮水困难','bad')}if(RESOURCES.food<0){RESOURCES.food=0;satisfaction=Math.max(0,satisfaction-5);if(population>1&&Math.random()<.3){population--;addLog('食物短缺，1位村民离开','bad')}}document.getElementById('income-food').textContent=`+${income.food.toFixed(1)} (-${vf}消耗)`;document.getElementById('income-wood').textContent=ws?`+${income.wood} (缺水停产)`:`+${income.wood}`;document.getElementById('income-stone').textContent=`+${income.stone}`;document.getElementById('income-gold').textContent=`+${income.gold.toFixed(1)}`;document.getElementById('income-water').textContent=`+${income.water.toFixed(1)} (-${vw+bwc}消耗)`;if(income.food>0)flashResource('res-food');if(income.wood>0)flashResource('res-wood');if(income.gold>0)flashResource('res-gold');if(income.water>0)flashResource('res-water');updateUI()}if(gameTime%15===0){if(RESOURCES.food>100)satisfaction=Math.min(100,satisfaction+1);satisfaction=Math.min(100,satisfaction+(population<=popMax?1:-3));if(health>70)satisfaction=Math.min(100,satisfaction+2);else if(health<30){satisfaction=Math.max(0,satisfaction-5);if(population>1&&Math.random()<.15){population--;addLog('健康度过低，1位村民病倒离开','bad')}}if(satisfaction>70&&population<popMax&&Math.random()<.3){population++;addLog('村庄繁荣，吸引新村民','good')}if(satisfaction<30&&population>1&&Math.random()<.2){population--;addLog('满意度太低，1位村民离开','bad')}}if(gameTime>10&&gameTime%50===0)triggerRandomEvent();checkLevelUp();if(population>stats.maxPop)stats.maxPop=population;checkAchievements();checkWinCondition()}

function triggerRandomEvent(){const av=EVENTS.filter(e=>villageLevel>=e.minLv);if(!av.length)return;let r=Math.random()*av.reduce((s,e)=>s+e.w,0);let ch=av[0];for(const e of av){r-=e.w;if(r<=0){ch=e;break}}if(ch.type==='bandit'){handleBanditEvent();return}stats.eventsHandled++;document.getElementById('modal-title').textContent=ch.t;document.getElementById('modal-text').textContent=ch.txt;const ct=document.getElementById('modal-btns');ct.innerHTML='';for(const cc of ch.ch){const btn=document.createElement('button');btn.className='modal-btn '+(cc.t.includes('拒绝')||cc.t.includes('算了')||cc.t.includes('不用')?'no':'yes');btn.textContent=cc.t;btn.onclick=()=>{cc.a();document.getElementById('modal-overlay').classList.remove('show');updateUI()};ct.appendChild(btn)}document.getElementById('modal-overlay').classList.add('show')}

function handleBanditEvent(){const s=getBanditScale();showBanditModal(s)}

function showBanditModal(s){const d=getBanditDemand(s),wr=getWallReduction(),gb=getGuardBonus(),rp=Math.round((wr+gb)*100),dt=d.gold!=null?`抢夺约${d.gold}金币`:`掳走约${d.casualties}人`;document.getElementById('modal-title').textContent=`🗡️ ${BANDIT_NAME[s]}来袭！`;document.getElementById('modal-text').innerHTML=`${dt}<br>🛡️ 当前防御：${rp}%`;const ct=document.getElementById('modal-btns');ct.innerHTML='';const rb=document.createElement('button');rb.className='modal-btn yes';rb.textContent='🎯 紧急加固 (+20%防御, -30🪵)';rb.disabled=RESOURCES.wood<30;rb.onclick=()=>{RESOURCES.wood-=30;resolveBandit(s,.2,d)};ct.appendChild(rb);const hb=document.createElement('button');hb.className='modal-btn no';hb.textContent='坚守阵地';hb.onclick=()=>resolveBandit(s,0,d);ct.appendChild(hb);document.getElementById('modal-overlay').classList.add('show')}

function resolveBandit(s,rb,d){document.getElementById('modal-overlay').classList.remove('show');stats.banditsFought++;const wr=getWallReduction(),gb=getGuardBonus(),red=Math.min(1,wr+gb+rb);if(d.gold!=null){const ls=Math.ceil(d.gold*(1-red));let rem=ls;const lg=Math.min(RESOURCES.gold,rem);RESOURCES.gold-=lg;rem-=lg;let lf=0;if(rem>0){lf=Math.min(RESOURCES.food,rem);RESOURCES.food-=lf;rem-=lf}const sh=Math.ceil(rem*.5);satisfaction=Math.max(0,satisfaction-sh);const ps=[];if(lg>0)ps.push(`金币-${lg}`);if(lf>0)ps.push(`食物-${lf}`);if(rem>0)ps.push(`满意度-${sh}`);if(!ps.length){stats.banditsPerfect++;addLog('城墙与守卫完全挡住了盗匪！','good')}else addLog(`盗匪洗劫：${ps.join('，')}`,'bad')}else{const cs=Math.ceil(d.casualties*(1-red));if(cs<=0){stats.banditsPerfect++;addLog('城墙与守卫完全挡住了盗匪！','good')}else if(hasClinic()){addLog(`盗匪造成${cs}名伤员，医馆全力救治...`,'bad');setTimeout(()=>{addLog(`${cs}名伤员已治愈`,'good');updateUI()},10000)}else{population=Math.max(1,population-cs);satisfaction=Math.max(0,satisfaction-10);addLog(`盗匪掳走${cs}名村民！满意度-10`,'bad')}}updateUI()}

// ===================== 成就系统 =====================
function applyAchvRw(a){const r=a.rw||{};if(r.gold)RESOURCES.gold+=r.gold;if(r.food)RESOURCES.food+=r.food;if(r.sat)satisfaction=Math.min(100,satisfaction+r.sat);if(r.research)research+=r.research}
function rwT(a){const r=a.rw||{},ps=[];if(r.gold)ps.push(`金币+${r.gold}`);if(r.food)ps.push(`食物+${r.food}`);if(r.sat)ps.push(`满意度+${r.sat}`);if(r.research)ps.push(`研究+${r.research}`);return ps.length?ps.join('，'):'无奖励'}
function showAchvToast(a){const w=document.getElementById('achv-toast-wrap');if(!w)return;const e=document.createElement('div');e.className='achv-toast';e.innerHTML=`<div class="t1">🏆 成就达成</div><div class="t2">${a.ic} ${a.nm}</div><div class="t3">${a.ds} · ${rwT(a)}</div>`;w.appendChild(e);setTimeout(()=>e.remove(),3900)}
function checkAchievements(){for(const a of ACHIEVEMENTS){if(unlockedAchievements.includes(a.id))continue;let ok=false;try{ok=!!a.ck()}catch(e){ok=false}if(!ok)continue;unlockedAchievements.push(a.id);applyAchvRw(a);showAchvToast(a);addLog(`🏆 达成成就「${a.nm}」（${rwT(a)}）`,'good')}updateAchvBtn()}
function silentSyncAchievements(){for(const a of ACHIEVEMENTS){if(unlockedAchievements.includes(a.id))continue;let ok=false;try{ok=!!a.ck()}catch(e){ok=false}if(ok)unlockedAchievements.push(a.id)}if(WIN_GOALS.every(g=>{try{return g.ok()}catch(e){return false}}))gameWon=true;updateAchvBtn()}
function updateAchvBtn(){const b=document.getElementById('achv-btn');if(b)b.textContent=`🏆 成就 ${unlockedAchievements.length}/${ACHIEVEMENTS.length}`}
function showAchievementModal(){const t=ACHIEVEMENTS.length,g=unlockedAchievements.length;document.getElementById('achv-count-text').textContent=`已解锁 ${g} / ${t}（${Math.round(g/t*100)}%）`;document.getElementById('achv-progress-fill').style.width=(g/t*100)+'%';let h='';for(const gr of ACHV_GROUPS){const ls=ACHIEVEMENTS.filter(a=>a.g===gr);if(!ls.length)continue;const gg=ls.filter(a=>unlockedAchievements.includes(a.id)).length;h+=`<div class="achv-group-title">${gr} · ${gg}/${ls.length}</div><div class="achv-grid">`;for(const a of ls){const d=unlockedAchievements.includes(a.id),s=a.hidden&&!d;h+=`<div class="achv-card ${d?'done':''}"><div class="ic">${s?'❔':a.ic}</div><div><div class="nm">${s?'???':a.nm}</div><div class="ds">${s?'隐藏成就，达成后揭晓':a.ds}</div><div class="rw">${d?'✅ '+rwT(a):(s?'':'奖励：'+rwT(a))}</div></div></div>`}h+='</div>'}document.getElementById('achv-list').innerHTML=h;document.getElementById('achv-overlay').classList.add('show')}
function closeAchievementModal(){document.getElementById('achv-overlay').classList.remove('show')}

// ===================== 通关目标 =====================
function renderGoalInfo(){const e=document.getElementById('goal-info');if(!e)return;if(gameWon){e.innerHTML=`<div class="upgrade-maxed">🎊 已通关 · 无尽经营中</div><div class="goal-hint">第${day}天，人口${population}，成就${unlockedAchievements.length}/${ACHIEVEMENTS.length}</div>`;return}const dc=WIN_GOALS.filter(g=>g.ok()).length;let h=`<div class="upgrade-next">进度 ${dc}/${WIN_GOALS.length}</div>`;for(const g of WIN_GOALS){const ok=g.ok();h+=`<div class="goal-row"><span>${g.ic} ${g.l}</span><span class="${ok?'g-done':'g-todo'}">${g.cur()} ${ok?'✅':''}</span></div>`}h+='<div class="goal-hint">五项全部达成即通关，可查看评级结算并继续无尽经营。</div>';e.innerHTML=h}
function computeWinRank(){const as=unlockedAchievements.length/ACHIEVEMENTS.length*60,od=Math.max(0,day-100),ts=Math.max(0,40-Math.floor(od/10)*3),total=Math.round(as+ts);let rk,cm;if(total>=85){rk='S';cm='千古一村长'}else if(total>=72){rk='A';cm='治村有方'}else if(total>=58){rk='B';cm='安稳一方'}else{rk='C';cm='磕磕绊绊'}return{rank:rk,comment:cm,total}}
function checkWinCondition(){if(gameWon)return;if(!WIN_GOALS.every(g=>g.ok()))return;gameWon=true;addLog('🎊 《村志》终章达成！你的村庄成了一方名镇！','good');showWinModal()}
function showWinModal(){const{rank,comment,total}=computeWinRank();document.getElementById('win-rank').textContent=rank;document.getElementById('win-comment').textContent=comment;const rs=[['用时',`${day}天`],['最终人口',`${population}/${popMax}`],['村庄等级',`Lv.${villageLevel}`],['建筑',`${buildings.length}座·${new Set(buildings.map(b=>b.type)).size}种`],['累计金币',`${Math.floor(stats.goldEarned)}`],['无损击退',`${stats.banditsPerfect}/${stats.banditsFought}次`],['事件',`${stats.eventsHandled}次`],['成就',`${unlockedAchievements.length}/${ACHIEVEMENTS.length}`],['综合评分',`${total}分`]];document.getElementById('win-stats').innerHTML=rs.map(r=>`<div class="win-stat-row"><span>${r[0]}</span><span class="v">${r[1]}</span></div>`).join('');document.getElementById('win-overlay').classList.add('show')}
function closeWinModal(){document.getElementById('win-overlay').classList.remove('show');addLog('村志已成，但日子还得往下过——无尽经营。','event')}

// ===================== 村庄升级 =====================
function checkLevelUp(){const lvs=[{lv:2,np:10,ng:300,ns:50},{lv:3,np:20,ng:800,ns:60},{lv:4,np:40,ng:2000,ns:70,needP:true}];for(const lv of lvs){if(villageLevel!==lv.lv-1)continue;if(population<lv.np||RESOURCES.gold<lv.ng||satisfaction<lv.ns)continue;if(lv.needP&&!hasPaifang())continue;villageLevel=lv.lv;for(const[k,v]of Object.entries(BT)){if(v.minLv<=villageLevel)v.unlocked=true}RESOURCES.gold+=lv.lv*100;satisfaction=Math.min(100,satisfaction+10);const t=document.getElementById('levelup-toast');t.innerHTML=`🎉 村庄升级到 Lv.${lv.lv}！<br><span style="font-size:16px;">解锁新建筑，奖励${lv.lv*100}金币</span>`;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);addLog(`村庄升级到Lv.${lv.lv}！`,'good');renderBuildPanel();initGrid();updateUI();break}}

// ===================== UI更新 =====================
function updateUI(){document.getElementById('val-gold').textContent=Math.floor(RESOURCES.gold);document.getElementById('val-food').textContent=Math.floor(RESOURCES.food);document.getElementById('val-wood').textContent=Math.floor(RESOURCES.wood);document.getElementById('val-stone').textContent=Math.floor(RESOURCES.stone);document.getElementById('val-water').textContent=Math.floor(RESOURCES.water);document.getElementById('val-pop').textContent=population;document.getElementById('val-popmax').textContent=popMax;document.getElementById('val-sat').textContent=Math.round(satisfaction);document.getElementById('sat-fill').style.width=satisfaction+'%';document.getElementById('village-level').textContent=`村庄 Lv.${villageLevel}`;document.getElementById('info-pop').textContent=`${population} / ${popMax}`;document.getElementById('info-buildings').textContent=`${buildings.length}/${GRID_COLS*GRID_ROWS}`;document.getElementById('info-sat').textContent=Math.round(satisfaction);document.getElementById('info-health').textContent=Math.round(health);document.getElementById('info-research').textContent=Math.floor(research);document.getElementById('info-officials').textContent=officials;document.getElementById('info-time').textContent=`第${day}天`;renderUpgradeInfo();renderGoalInfo();updateAchvBtn();renderBuildPanel()}
function renderUpgradeInfo(){const e=document.getElementById('upgrade-info'),lvs=[{lv:2,np:10,ng:300,ns:50},{lv:3,np:20,ng:800,ns:60},{lv:4,np:40,ng:2000,ns:70,needP:true}];const n=lvs.find(l=>l.lv===villageLevel+1);if(!n){e.innerHTML='<div class="upgrade-maxed">✅ 已满级！</div>';return}const rs=[{la:'👥 人口',cur:population,need:n.np},{la:'💰 金币',cur:Math.floor(RESOURCES.gold),need:n.ng},{la:'😊 满意度',cur:Math.round(satisfaction),need:n.ns}];let h=`<div class="upgrade-next">下一级：Lv.${n.lv}</div>`;for(const r of rs){const m=r.cur>=r.need;h+=`<div class="upgrade-row"><span>${r.la}</span><span class="${m?'req-met':'req-not'}">${r.cur}/${r.need} ${m?'✅':''}</span></div>`}if(n.needP){const m=hasPaifang();h+=`<div class="upgrade-row"><span>🏛️ 牌坊</span><span class="${m?'req-met':'req-not'}">${m?'已建成 ✅':'未建造'}</span></div>`}e.innerHTML=h}

// ===================== 暂停/速度 =====================
function togglePause(){gamePaused=!gamePaused;const b=document.getElementById('pause-btn');if(gamePaused){clearInterval(tickInterval);b.classList.add('active');b.textContent='▶ 继续'}else{tickInterval=setInterval(tick,1000/gameSpeed);b.classList.remove('active');b.textContent='⏸ 暂停'}}
function setSpeed(s){gameSpeed=s;document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('active'));document.querySelector(`.speed-btn:nth-child(${s})`).classList.add('active');if(!gamePaused){clearInterval(tickInterval);tickInterval=setInterval(tick,1000/gameSpeed)}}

// ===================== 存档系统 =====================
function getSaveData(){return{resources:{...RESOURCES},population,popMax,satisfaction,villageLevel,day,gameTime,buildings:buildings.map(b=>({type:b.type,workers:b.workers,level:b.level,guards:b.guards||0,scholars:b.scholars||0,index:b.index})),health,research,officials,stats:{...stats},unlockedAchievements:[...unlockedAchievements],gameWon,saveTime:new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}}
function saveGame(k){try{localStorage.setItem(k,JSON.stringify(getSaveData()));addLog('游戏已保存','good');return true}catch(e){addLog('保存失败：存储空间不足','bad');return false}}
function loadGame(k){const r=localStorage.getItem(k);if(!r)return false;try{const d=JSON.parse(r);RESOURCES.gold=d.resources.gold;RESOURCES.food=d.resources.food;RESOURCES.wood=d.resources.wood;RESOURCES.stone=d.resources.stone;RESOURCES.water=d.resources.water||20;health=d.health!=null?d.health:80;research=d.research||0;officials=d.officials||0;population=d.population;popMax=d.popMax;satisfaction=d.satisfaction;villageLevel=d.villageLevel;day=d.day;gameTime=d.gameTime;buildings=[];for(let i=0;i<gridData.length;i++)gridData[i]=null;for(const b of d.buildings){const o={type:b.type,workers:b.workers,level:b.level,guards:b.guards||0,scholars:b.scholars||0,index:b.index};gridData[b.index]=o;buildings.push(o)}for(const b of buildings){const bt=BT[b.type];if((b.workers||0)===0&&bt.maxW>0&&bt.prod&&Object.keys(bt.prod).length&&getIdlePopulation()>=1)b.workers=1}stats={...DEFAULT_STATS,...(d.stats||{})};unlockedAchievements=Array.isArray(d.unlockedAchievements)?d.unlockedAchievements.slice():[];gameWon=!!d.gameWon;for(const[k,v]of Object.entries(BT)){if(v.minLv<=villageLevel)v.unlocked=true}if(!Array.isArray(d.unlockedAchievements)){stats.maxPop=Math.max(stats.maxPop,population);silentSyncAchievements()}initGrid();renderAll();updateUI();addLog(`读档成功（第${day}天）`,'good');return true}catch(e){addLog('读档失败：存档损坏','bad');return false}}

function getSlotInfo(k){const r=localStorage.getItem(k);if(!r)return null;try{const d=JSON.parse(r);return{day:d.day,saveTime:d.saveTime||'',villageLevel:d.villageLevel}}catch(e){return null}}
function showSaveModal(m){saveMode=m;const o=document.getElementById('save-overlay'),t=document.getElementById('save-modal-title'),c=document.getElementById('save-slots-container');t.textContent=m==='save'?'💾 存档':'📂 读档';const sn=['存档一','存档二','存档三'];let h='';for(let i=0;i<3;i++){const info=getSlotInfo(SAVE_KEYS[i]);h+=`<div class="save-slot" onclick="onSlotClick('${SAVE_KEYS[i]}')">`+`<div class="save-slot-name">${sn[i]}</div>`+(info?`<div class="save-slot-detail">第${info.day}天 · 村庄Lv.${info.villageLevel} · ${info.saveTime}</div>`:'<div class="save-slot-detail" style="color:#666;">空</div>')+'</div>'}const ai=getSlotInfo(AUTOSAVE_KEY);if(ai)h+=`<div class="save-slot" onclick="onSlotClick('${AUTOSAVE_KEY}')"><div class="save-slot-name">🕐 自动存档</div><div class="save-slot-detail">第${ai.day}天 · 村庄Lv.${ai.villageLevel} · ${ai.saveTime}</div></div>`;c.innerHTML=h;o.classList.add('show')}
function closeSaveModal(){document.getElementById('save-overlay').classList.remove('show')}
function onSlotClick(k){if(saveMode==='save'){const ex=getSlotInfo(k);if(ex&&!confirm(`覆盖「第${ex.day}天 · Lv.${ex.villageLevel}」的存档？`))return;saveGame(k);closeSaveModal()}else{const info=getSlotInfo(k);if(!info)return;if(!confirm(`读取「第${info.day}天 · Lv.${info.villageLevel}」的存档？当前进度将丢失。`))return;loadGame(k);closeSaveModal();if(gamePaused)togglePause();if(!gamePaused&&!tickInterval)tickInterval=setInterval(tick,1000/gameSpeed)}}

// ===================== 启动 =====================
initGrid();
const autoSave=getSlotInfo(AUTOSAVE_KEY);
const manualSave=getSlotInfo(SAVE_KEYS[0])||getSlotInfo(SAVE_KEYS[1])||getSlotInfo(SAVE_KEYS[2]);
latestSave=(()=>{let best=null;for(const k of[AUTOSAVE_KEY,...SAVE_KEYS]){const i=getSlotInfo(k);if(i&&(!best||i.day>best.info.day)){best={key:k,info:i}}}return best})();
if(latestSave){document.getElementById('modal-title').textContent='🏠 欢迎回来，村长';document.getElementById('modal-text').innerHTML=`检测到存档：<b>第${latestSave.info.day}天 · 村庄Lv.${latestSave.info.villageLevel}</b><br>是否继续游戏？`;document.getElementById('modal-btns').innerHTML=`<button class="modal-btn yes" onclick="confirmContinue('${latestSave.key}')">继续游戏</button><button class="modal-btn no" onclick="confirmNewGame()">重新开始</button>`;document.getElementById('modal-overlay').classList.add('show')}else{tickInterval=setInterval(tick,1000/gameSpeed);updateUI();addLog('你是新任村长，带领村民建设家园吧！','event');addLog('提示：先建水井产水，再建农田和伐木场（点击建筑可派/撤工人）','event')}
function confirmContinue(k){document.getElementById('modal-overlay').classList.remove('show');loadGame(k);for(const[v]of Object.entries(BT)){if(v.minLv<=villageLevel)v.unlocked=true}initGrid();renderAll();updateUI();if(!gamePaused&&!tickInterval)tickInterval=setInterval(tick,1000/gameSpeed)}
function confirmNewGame(){document.getElementById('modal-overlay').classList.remove('show');resetGame()}

// ===================== 重新开始 =====================
function confirmReset(){const o=document.getElementById('modal-overlay');document.getElementById('modal-title').textContent='🔄 重新开始';document.getElementById('modal-text').innerHTML='确定重新开始？所有进度将清空，无法恢复。';const ct=document.getElementById('modal-btns');ct.innerHTML='';const y=document.createElement('button');y.className='modal-btn yes';y.textContent='确定重新开始';y.onclick=()=>{o.classList.remove('show');resetGame()};ct.appendChild(y);const n=document.createElement('button');n.className='modal-btn no';n.textContent='取消';n.onclick=()=>o.classList.remove('show');ct.appendChild(n);o.classList.add('show')}
function resetGame(){RESOURCES.gold=500;RESOURCES.food=50;RESOURCES.wood=30;RESOURCES.stone=0;RESOURCES.water=20;population=3;popMax=5;satisfaction=65;health=80;research=0;officials=0;villageLevel=1;day=1;gameTime=0;buildings=[];stats={...DEFAULT_STATS};unlockedAchievements=[];gameWon=false;document.getElementById('achv-toast-wrap').innerHTML='';GRID_COLS=8;GRID_ROWS=5;gridData.length=0;for(const[k,v]of Object.entries(BT))v.unlocked=v.minLv<=1;localStorage.removeItem(AUTOSAVE_KEY);document.getElementById('log-area').innerHTML='';addLog('村庄重置！你是新任村长，加油吧！','event');addLog('提示：先建水井产水，再建农田和伐木场（点击建筑可派/撤工人）','event');initGrid();updateUI();clearInterval(tickInterval);gamePaused=false;const pb=document.getElementById('pause-btn');pb.classList.remove('active');pb.textContent='⏸ 暂停';tickInterval=setInterval(tick,1000/gameSpeed)}

// 每60秒自动存档
setInterval(()=>{if(!gamePaused&&buildings.length>0)saveGame(AUTOSAVE_KEY)},60000);

</script>
</body>
</html>
